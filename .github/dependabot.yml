version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # CI checks pull request titles against the Conventional Commits convention.
    # Dependabot otherwise infers the style from recent history, which is
    # implicit and can drift; state it instead.
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Batch non-major updates into a single PR; majors stay separate for review.
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Batch non-major updates into a single PR; majors stay separate for review.
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
