name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan for secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/scan" ghcr.io/betterleaks/betterleaks:latest dir --redact /scan

  pr-title:
    # Merges are squashed, so the pull request title becomes main's commit
    # subject. It gets the same check a local commit message does.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the base revision, not the pull request's own code: a branch
      # must not be able to edit the validator that judges it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Test the subject validator
        run: |
          if [ ! -x ./scripts/check-commit-subject.sh ]; then
            echo "Validator absent from the base revision — skipping until this lands on main."
            exit 0
          fi
          ./tests/check_commit_subject_test.sh

      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ ! -x ./scripts/check-commit-subject.sh ]; then
            echo "Validator absent from the base revision — skipping until this lands on main."
            exit 0
          fi
          ./scripts/check-commit-subject.sh "$PR_TITLE"

  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit

  check:
    needs: [fmt, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: ./node_modules/.bin/vitest run

      - name: Build the client bundle
        run: npm run build

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Check dependency licenses
        run: ./node_modules/.bin/licensee --errors-only

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          output-file: letterpress-sbom.cdx.json
          artifact-name: sbom-cyclonedx

      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: letterpress-sbom.cdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table
