name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  sonarqube:
    # Dependabot runs don't receive Actions secrets, so SONAR_TOKEN is empty
    # and the scan can't authenticate. The guard used to live on the job
    # itself, but a skipped job reports no conclusion, and a required status
    # check treats that as failing — which permanently blocked every
    # Dependabot PR from merging once this check became required. Guarding
    # each step instead keeps the job running (and reporting success) while
    # doing nothing for dependabot.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.actor != 'dependabot[bot]'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.actor != 'dependabot[bot]'
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
        if: github.actor != 'dependabot[bot]'

      - name: Generate code coverage
        if: github.actor != 'dependabot[bot]'
        run: ./node_modules/.bin/vitest run --coverage --coverage.reporter=lcov

      - name: Read package version
        if: github.actor != 'dependabot[bot]'
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Pinned by version tag rather than SHA: a 40-hex SHA next to "sonarqube"
      # trips Semgrep's generic SonarQube-token detector. Dependabot tracks the tag.
      - name: SonarQube Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dsonar.projectVersion=${{ steps.package-version.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
